<!doctype html>
<html lang="id" data-mode="terang">
<head>
<script src="tema.js"></script>
<link rel="stylesheet" href="tema.css">
<script>
  (function () {
    var m = (window.TEMA && window.TEMA.mode) || "terang";
    try { var s = localStorage.getItem("crm_mode"); if (s) m = s; } catch (e) {}
    if (m === "auto") m = matchMedia("(prefers-color-scheme: dark)").matches ? "gelap" : "terang";
    document.documentElement.setAttribute("data-mode", m);
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manajemen Klien — CRM Freelancer & Agensi</title>
<meta name="description" content="CRM ringan tanpa server untuk freelancer dan agensi: klien, pipeline, proyek, invoice, pengingat follow-up, laporan.">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-bagian="latar">
<a class="skip" href="#utama">Lewati ke konten</a>

<!-- Layar PIN -->
<section id="kunci" class="kunci" aria-labelledby="kunci-judul" hidden>
  <div class="kunci-kartu">
    <div class="logo-besar" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#i-logo"/></svg></div>
    <h1 id="kunci-judul" data-tema-nama>Studio</h1>
    <p class="redup">Masukkan PIN untuk membuka CRM</p>
    <div class="pin-titik" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <label class="sr" for="pin-input">PIN 4 digit</label>
    <input id="pin-input" class="pin-input" inputmode="numeric" maxlength="4" autocomplete="off" pattern="[0-9]*">
    <div class="pin-pad" role="group" aria-label="Papan angka PIN">
      <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
      <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
      <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
      <span></span><button data-pin="0">0</button><button data-pin="del" aria-label="Hapus digit">⌫</button>
    </div>
    <p class="kecil redup" id="pin-pesan" role="status">PIN bawaan: 1234 (ganti di Pengaturan)</p>
  </div>
</section>

<div id="app" class="app" hidden>
  <aside data-bagian="nav" class="samping" id="samping" aria-label="Navigasi utama">
    <div class="merek">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#i-logo"/></svg></span>
      <span><b data-tema-nama>Studio</b><small>CRM Klien</small></span>
    </div>
    <nav>
      <a href="#dashboard" data-nav="dashboard"><svg><use href="#i-home"/></svg><span>Dashboard</span></a>
      <a href="#klien" data-nav="klien"><svg><use href="#i-users"/></svg><span>Klien</span></a>
      <a href="#pipeline" data-nav="pipeline"><svg><use href="#i-kanban"/></svg><span>Pipeline</span></a>
      <a href="#proyek" data-nav="proyek"><svg><use href="#i-folder"/></svg><span>Proyek</span></a>
      <a href="#invoice" data-nav="invoice"><svg><use href="#i-doc"/></svg><span>Invoice</span></a>
      <a href="#pengingat" data-nav="pengingat"><svg><use href="#i-bell"/></svg><span>Follow-up</span><em id="badge-fu" data-bagian="aksen" class="badge-nav" hidden></em></a>
      <a href="#laporan" data-nav="laporan"><svg><use href="#i-chart"/></svg><span>Laporan</span></a>
      <a href="#pengaturan" data-nav="pengaturan"><svg><use href="#i-gear"/></svg><span>Pengaturan</span></a>
    </nav>
    <div class="samping-bawah">
      <button class="btn-hantu penuh" id="btn-kunci"><svg><use href="#i-lock"/></svg>Kunci</button>
    </div>
  </aside>

  <div class="kanan">
    <header class="atas" data-bagian="nav">
      <button class="ikon-btn hp-saja" id="btn-menu" aria-label="Buka menu" aria-expanded="false" aria-controls="samping"><svg><use href="#i-menu"/></svg></button>
      <button class="cari-pemicu" id="btn-cari" aria-label="Cari (Ctrl+K)">
        <svg><use href="#i-search"/></svg><span>Cari klien, proyek, invoice…</span><kbd>⌘K</kbd>
      </button>
      <div class="atas-kanan">
        <button class="ikon-btn" id="btn-mode" aria-label="Ganti mode terang/gelap"><svg class="m-terang"><use href="#i-moon"/></svg><svg class="m-gelap"><use href="#i-sun"/></svg></button>
        <div class="tambah-wrap">
          <button class="btn" data-bagian="utama" id="btn-tambah" aria-haspopup="menu" aria-expanded="false"><svg><use href="#i-plus"/></svg><span>Baru</span></button>
          <div class="menu" id="menu-tambah" role="menu" hidden>
            <button role="menuitem" data-baru="klien">Klien</button>
            <button role="menuitem" data-baru="deal">Prospek / deal</button>
            <button role="menuitem" data-baru="proyek">Proyek</button>
            <button role="menuitem" data-baru="invoice">Invoice</button>
            <button role="menuitem" data-baru="penawaran">Penawaran</button>
            <button role="menuitem" data-baru="pengingat">Pengingat follow-up</button>
          </div>
        </div>
      </div>
    </header>
    <main id="utama" data-bagian="latar" class="utama" tabindex="-1"></main>
  </div>
</div>

<div class="tirai" id="tirai" hidden></div>

<!-- Modal generik -->
<div class="modal-lapis" id="modal" hidden>
  <div class="modal" data-bagian="panel" role="dialog" aria-modal="true" aria-labelledby="modal-judul">
    <header><h2 id="modal-judul">Judul</h2><button class="ikon-btn" data-tutup aria-label="Tutup"><svg><use href="#i-x"/></svg></button></header>
    <div class="modal-isi" id="modal-isi"></div>
  </div>
</div>

<!-- Command palette -->
<div class="modal-lapis palet-lapis" id="palet" hidden>
  <div class="palet" role="dialog" aria-modal="true" aria-label="Pencarian global">
    <div class="palet-cari"><svg><use href="#i-search"/></svg>
      <input id="palet-input" role="combobox" aria-expanded="true" aria-controls="palet-hasil" aria-autocomplete="list" placeholder="Ketik nama klien, proyek, nomor invoice, atau perintah…" autocomplete="off">
      <kbd>Esc</kbd></div>
    <ul id="palet-hasil" role="listbox" aria-label="Hasil"></ul>
  </div>
</div>

<div class="toast-wadah" id="toasts" aria-live="polite"></div>
<div id="cetak" class="cetak" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="var(--utama)"/><circle cx="25" cy="25" r="8" fill="#fff"/><path d="M11 48c2-8 8-12 14-12s12 4 14 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="22" r="6" fill="var(--aksen)"/><path d="M40 34c6 0 11 3 13 10" fill="none" stroke="var(--aksen)" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M19 15c2 1 3 3 3 6"/></symbol>
    <symbol id="i-kanban" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a7 7 0 0 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.8z"/><path d="M9 9c0 3 3 6 6 6l1-1.5-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M6 11l6 6 6-6M4 20h16"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
