<!doctype html>

<html lang="id">
<head>
<script src="tema.js"></script>
<link rel="stylesheet" href="tema.css">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
<style>
body{margin:0;background:#e9e4da;font:400 15px/1.55 var(--tema-font);color:#1b1814}
.kertas{max-width:820px;margin:24px auto;background:#fff;padding:48px 56px;border-radius:8px}
h1{font-size:44px;letter-spacing:-.04em;margin:0;line-height:1}h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--tema-utama);margin:28px 0 10px;border-bottom:1px solid #ddd;padding-bottom:6px}
.sub{color:#555;margin:6px 0 0}.item{display:grid;grid-template-columns:150px 1fr;gap:12px;margin-bottom:10px}.item small{color:#666}
.cetak{position:fixed;right:16px;bottom:16px;min-height:48px;padding:0 20px;border:0;border-radius:99px;background:var(--tema-utama);color:#fff;font:600 15px var(--tema-font);cursor:pointer}
ul{margin:0;padding-left:18px}
@media(max-width:600px){.kertas{padding:28px 20px;margin:0}.item{grid-template-columns:1fr;gap:0}}
@media print{body{background:#fff}.kertas{margin:0;padding:0}.cetak{display:none}}
</style>
</head>
<body>
<main class="kertas" id="cv"></main>
<button class="cetak" onclick="print()">Simpan sebagai PDF / Cetak</button>
<script src="data.js"></script>
<script>
(function(){var D=window.DATA,N=(window.TEMA&&TEMA.nama)||'',e=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
document.title='CV — '+N;
document.getElementById('cv').innerHTML='<h1>'+e(N)+'</h1><p class="sub">'+e(D.peran)+' · '+e(D.kota)+' · '+e(D.email)+' · +'+e(D.wa)+'</p>'+
'<h2>Profil</h2><p>'+e(D.ringkas)+'</p>'+
'<h2>Pengalaman & Pendidikan</h2>'+D.pengalaman.map(function(p){return '<div class="item"><small>'+e(p.tahun)+'</small><div><b>'+e(p.posisi)+'</b> — '+e(p.tempat)+'<br>'+e(p.ket)+'</div></div>'}).join('')+
'<h2>Keahlian</h2><p>'+D.keahlian.map(function(k){return e(k.nama)}).join(' · ')+'</p><p><b>Alat:</b> '+D.alat.map(e).join(', ')+'</p>'+
'<h2>Karya pilihan</h2><ul>'+D.karya.map(function(k){return '<li><b>'+e(k.judul)+'</b> ('+e(k.kategori)+', '+e(k.tahun)+') — '+e(k.ringkas)+'</li>'}).join('')+'</ul>'+
'<p style="margin-top:32px;font-size:11px;color:#999">Template oleh Maliki Saputra · malikisaputra.biz.id</p>';})();
</script>
</body>
</html>
